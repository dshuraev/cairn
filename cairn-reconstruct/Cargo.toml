[package]
name = "cairn-reconstruct"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
cairn-core = { path = "../cairn-core" }
cairn-store = { path = "../cairn-store" }
xattr = "1.6.1"
nix = { version = "0.29", features = ["fs", "user"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[[bin]]
name = "cairn-reconstruct"
path = "src/bin/cairn_reconstruct.rs"

[dev-dependencies]
tempfile = "3"
cairn-digest = { path = "../cairn-digest" }
